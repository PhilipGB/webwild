name: ci

on:
  push:
    branches: [main, "p*-*"]
  pull_request:

jobs:
  dotnet:
    name: Build and pure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -warnaserror
      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=normal"

  godot-import:
    name: Godot .NET import and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Godot 4.7.2 .NET
        run: |
          set -e
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          echo "GODOT=$PWD/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_MONO_PATH=$PWD/Godot_v4.7.2-stable_mono_linux_x86_64/GodotSharp" >> "$GITHUB_ENV"
      - name: Build C#
        run: dotnet build
      - name: Import project
        run: '"$GODOT" --headless --path . --editor --quit'
      - name: Headless startup
        run: '"$GODOT" --headless --path . --quit-after 120'
      - name: Runtime acceptance probe
        run: '"$GODOT" --headless --path . -- --runtime-probe'
